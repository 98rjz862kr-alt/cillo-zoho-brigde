name: LMI DLA registry capability probe

on:
  push:
    branches:
      - work/dla-runtime-bridge-20260929
    paths:
      - .github/workflows/lmi-dla-registry-probe.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/98rjz862kr-alt/lmi-application-privee-integration-contenus:raisonnable-fullbody-703b2288
    steps:
      - name: Probe registry capabilities without exposing credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          login=false
          pull=false
          push=false
          if printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/tmp/login.log 2>&1; then
            login=true
          fi
          if [ "$login" = true ] && docker pull "$IMAGE" >/tmp/pull.log 2>&1; then
            pull=true
          fi
          if [ "$pull" = true ]; then
            probe="ghcr.io/98rjz862kr-alt/lmi-application-privee-integration-contenus:dla-probe-${GITHUB_SHA}"
            docker tag "$IMAGE" "$probe"
            if docker push "$probe" >/tmp/push.log 2>&1; then
              push=true
            fi
          fi
          printf '{"login":%s,"pull":%s,"push":%s,"run":"%s"}\n' "$login" "$pull" "$push" "$GITHUB_RUN_ID" > /tmp/status.json
          content="$(base64 -w0 /tmp/status.json)"
          path=".lmi-probes/dla-registry-${GITHUB_RUN_ID}.json"
          curl -fsS -X PUT             "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             -H 'Content-Type: application/json'             --data "{"message":"ci: record DLA registry capability probe","content":"$content","branch":"$GITHUB_REF_NAME"}" >/dev/null
          test "$pull" = true
