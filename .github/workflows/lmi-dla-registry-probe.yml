name: LMI DLA registry access probe

on:
  push:
    branches:
      - work/dla-runtime-bridge-20260929
    paths:
      - .github/workflows/lmi-dla-registry-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  registry-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull current LMI application image
        run: docker pull ghcr.io/98rjz862kr-alt/lmi-application-privee-integration-contenus:raisonnable-fullbody-703b2288
      - name: Probe write permission with isolated tag
        run: |
          set -eu
          src=ghcr.io/98rjz862kr-alt/lmi-application-privee-integration-contenus:raisonnable-fullbody-703b2288
          dst=ghcr.io/98rjz862kr-alt/lmi-application-privee-integration-contenus:dla-crossrepo-probe-${GITHUB_SHA}
          docker tag "$src" "$dst"
          docker push "$dst"
