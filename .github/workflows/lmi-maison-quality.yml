name: LMI Maison quality

on:
  push:
    branches: [main]
    paths:
      - "drafts/lmi-maison-site/**"
      - "scripts/validate-lmi-maison.mjs"
      - "package.json"
      - ".github/workflows/lmi-maison-quality.yml"
  pull_request:
    paths:
      - "drafts/lmi-maison-site/**"
      - "scripts/validate-lmi-maison.mjs"
      - "package.json"
      - ".github/workflows/lmi-maison-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lmi-maison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run repository validation
        run: npm test
      - name: Validate LMI Maison only
        run: node scripts/validate-lmi-maison.mjs
