name: Boa Render secret flags diagnostic

on:
  push:
    branches:
      - agent/boa-totem-soya-render-verify-20260816
    paths:
      - .github/workflows/boa-render-secret-flags.yml

permissions:
  contents: read

jobs:
  flags:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_BRIDGE_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BRIDGE_DEPLOY_HOOK_URL }}
      BRIDGE_RENDER_DEPLOY_HOOK_URL: ${{ secrets.BRIDGE_RENDER_DEPLOY_HOOK_URL }}
      CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL: ${{ secrets.CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL }}
      RENDER_BRIDGE_SERVICE_ID: ${{ secrets.RENDER_BRIDGE_SERVICE_ID }}
    steps:
      - name: Afficher uniquement la présence des secrets
        shell: bash
        run: |
          for n in RENDER_API_KEY RENDER_DEPLOY_HOOK_URL RENDER_DEPLOY_HOOK RENDER_SERVICE_ID RENDER_BRIDGE_DEPLOY_HOOK_URL BRIDGE_RENDER_DEPLOY_HOOK_URL CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL RENDER_BRIDGE_SERVICE_ID; do
            if [ -n "${!n:-}" ]; then echo "$n=PRESENT"; else echo "$n=ABSENT"; fi
          done
