name: Boa Render secret flags diagnostic

on:
  push:
    branches:
      - agent/boa-totem-soya-render-verify-20260816
    paths:
      - .github/workflows/boa-render-secret-flags.yml

permissions:
  contents: read

jobs:
  flags:
    runs-on: ubuntu-latest
    env:
      S_RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      S_RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      S_RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      S_RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      S_RENDER_BRIDGE_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BRIDGE_DEPLOY_HOOK_URL }}
      S_BRIDGE_RENDER_DEPLOY_HOOK_URL: ${{ secrets.BRIDGE_RENDER_DEPLOY_HOOK_URL }}
      S_CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL: ${{ secrets.CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL }}
      S_RENDER_BRIDGE_SERVICE_ID: ${{ secrets.RENDER_BRIDGE_SERVICE_ID }}
      V_RENDER_API_KEY: ${{ vars.RENDER_API_KEY }}
      V_RENDER_DEPLOY_HOOK_URL: ${{ vars.RENDER_DEPLOY_HOOK_URL }}
      V_RENDER_DEPLOY_HOOK: ${{ vars.RENDER_DEPLOY_HOOK }}
      V_RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      V_RENDER_BRIDGE_DEPLOY_HOOK_URL: ${{ vars.RENDER_BRIDGE_DEPLOY_HOOK_URL }}
      V_BRIDGE_RENDER_DEPLOY_HOOK_URL: ${{ vars.BRIDGE_RENDER_DEPLOY_HOOK_URL }}
      V_CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL: ${{ vars.CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL }}
      V_RENDER_BRIDGE_SERVICE_ID: ${{ vars.RENDER_BRIDGE_SERVICE_ID }}
    steps:
      - name: Afficher uniquement la présence des accès Render
        shell: bash
        run: |
          for n in S_RENDER_API_KEY S_RENDER_DEPLOY_HOOK_URL S_RENDER_DEPLOY_HOOK S_RENDER_SERVICE_ID S_RENDER_BRIDGE_DEPLOY_HOOK_URL S_BRIDGE_RENDER_DEPLOY_HOOK_URL S_CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL S_RENDER_BRIDGE_SERVICE_ID V_RENDER_API_KEY V_RENDER_DEPLOY_HOOK_URL V_RENDER_DEPLOY_HOOK V_RENDER_SERVICE_ID V_RENDER_BRIDGE_DEPLOY_HOOK_URL V_BRIDGE_RENDER_DEPLOY_HOOK_URL V_CILLO_ZOHO_BRIDGE_DEPLOY_HOOK_URL V_RENDER_BRIDGE_SERVICE_ID; do
            if [ -n "${!n:-}" ]; then echo "$n=PRESENT"; else echo "$n=ABSENT"; fi
          done
