name: Boa Totem - continuity guard

on:
  push:
    branches:
      - agent/boa-totem-soya-finalisation-20260816
    paths:
      - scripts/normalize-boa-dialogues.mjs
      - drafts/boa-totem-soya/**
      - .github/workflows/boa-finalisation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verifier la continuite sans modifier le depot
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow lecture seule: aucune normalisation automatique n'est ecrite dans le depot."
          test -f drafts/boa-totem-soya/18-dialogues-verrouilles-reference.html
          grep -F "Attends... ça recommence seulement quand tu avances." drafts/boa-totem-soya/18-dialogues-verrouilles-reference.html >/dev/null
          grep -F "C'est moi que le signe a arrêtée. Alors c'est moi qui dois commencer." drafts/boa-totem-soya/18-dialogues-verrouilles-reference.html >/dev/null
