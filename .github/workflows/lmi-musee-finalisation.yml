name: LMI Musee Finalisation

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  musee-finalisation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Runner startup probe
        run: |
          echo "runner-started"
          node --version
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate LMI Musee legacy gate
        run: node scripts/validate-lmi-musee.mjs
      - name: Audit LMI Musee finalisation gate
        run: node scripts/audit-lmi-musee-finalisation.mjs
