name: Boa Totem - normalisation dialogues

on:
  push:
    branches:
      - agent/boa-totem-soya-dialogues-conformes-20260804
    paths:
      - scripts/normalize-boa-dialogues.mjs
      - .github/workflows/boa-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/boa-totem-soya-dialogues-conformes-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normaliser les dialogues verrouilles
        run: node scripts/normalize-boa-dialogues.mjs
      - name: Enregistrer les corrections
        run: |
          if git diff --quiet; then
            echo "Aucune correction supplementaire"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/boa-totem-soya
          git commit -m "Boa Totem: harmoniser les dialogues verrouilles"
          git push origin HEAD:agent/boa-totem-soya-dialogues-conformes-20260804
