name: CDM Machine

on:
  push:
    branches: [main]
    paths:
      - "cdm-v3/**"
      - "data/pages.json"
      - "drafts/**"
      - "drafts.js"
      - "hub-*.js"
      - "package.json"
      - "scripts/*.mjs"
      - "server.js"
      - ".github/workflows/cdm-machine.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "cdm-v3/**"
      - "data/pages.json"
      - "drafts/**"
      - "drafts.js"
      - "hub-*.js"
      - "package.json"
      - "scripts/*.mjs"
      - "server.js"
      - ".github/workflows/cdm-machine.yml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  python-machine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdm-v3
    env:
      PYTHONPATH: ${{ github.workspace }}/cdm-v3
      CDM_DB_PATH: /tmp/cdm-ci.sqlite3
      CDM_SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cdm-v3/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile application
        run: python -m compileall -q app
      - name: Run tests
        run: python -m pytest -q
      - name: Verify service routes
        run: |
          uvicorn app.main_machine:app --host 127.0.0.1 --port 8010 > /tmp/cdm-machine.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8010/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8010/api/machine/health | grep '"status":"ok"'
          curl -fsSL http://127.0.0.1:8010/ | grep 'Machine de contrôle'
          curl -fsS http://127.0.0.1:8010/machine-api.js | grep 'api/machine'

  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Validate pages and drafts
        run: npm test
      - name: Verify protected BAT route
        env:
          PORT: "3010"
          ADMIN_PASSWORD: "ci-only"
        run: |
          node server.js > /tmp/cdm-bridge.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3010/health && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3010/atelier?password=ci-only" | grep 'pouvoir-et-miroirs-recette.html'
          curl -fsS "http://127.0.0.1:3010/atelier/file/revue-des-satires%2Fpouvoir-et-miroirs-recette.html?password=ci-only" | grep 'La Revue des Satires — Pouvoir et miroirs — Recette humaine'
          curl -fsS "http://127.0.0.1:3010/atelier/file/hub-lmi-editions%2F26-feodalisme-religieux.html?password=ci-only" | grep 'data-lmi-runtime="premium-v2"'
          curl -fsS "http://127.0.0.1:3010/atelier/file/hub-lmi-editions%2F26-feodalisme-religieux.html?password=ci-only" | grep 'lmi-route-breadcrumb'
          curl -fsS "http://127.0.0.1:3010/atelier/file/hub-lmi-editions%2F26-feodalisme-religieux.html?password=ci-only" | grep 'feodalisme-religieux-fragmentation'
          curl -fsS "http://127.0.0.1:3010/atelier/file/rokku-site%2F00-controle-prepublication.html?password=ci-only" | grep 'SOCLE ROKKU RESTAURÉ'
          curl -fsS "http://127.0.0.1:3010/atelier/file/rokku-site%2F01-bat-boutique.html?password=ci-only" | grep 'COMMANDES ET PAIEMENTS DÉSACTIVÉS'
          curl -fsS "http://127.0.0.1:3010/atelier/file/rokku-site%2F01-bat-boutique.html?password=ci-only" | grep 'Le plaisir d’offrir'
          curl -fsS http://127.0.0.1:3010/preview/cdm-validation-v040 | grep 'Machine de contrôle'
          curl -fsS http://127.0.0.1:3010/preview/cdm-validation-v040 | grep 'Contrôle global'

  live-render:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose deployed Render service
        run: |
          base="https://cillo-zoho-bridge.onrender.com"
          for path in / /health /atelier /admin /preview/cdm-validation-v040; do
            safe=$(printf '%s' "$path" | tr '/-' '__')
            code=$(curl -sSL --max-time 60 -D "/tmp/${safe}.headers" -o "/tmp/${safe}.body" -w '%{http_code}' "$base$path" || true)
            echo "===== $path HTTP $code ====="
            sed -n '1,20p' "/tmp/${safe}.headers"
            echo "----- body -----"
            head -c 1200 "/tmp/${safe}.body" || true
            echo
          done
          preview_code=$(curl -sSL --max-time 60 -o /tmp/render-machine.html -w '%{http_code}' "$base/preview/cdm-validation-v040" || true)
          test "$preview_code" = "200"
          grep 'CDM — Machine de contrôle v1.4' /tmp/render-machine.html
          grep 'Machine de contrôle & déploiement maîtrisé' /tmp/render-machine.html
          grep 'Contrôle global' /tmp/render-machine.html
          grep 'Sauvegarder Drive' /tmp/render-machine.html
          grep 'Rapports & traçabilité' /tmp/render-machine.html
          grep 'data-a=' /tmp/render-machine.html
          test "$(wc -c < /tmp/render-machine.html)" -gt 20000
