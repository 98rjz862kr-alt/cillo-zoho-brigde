name: CDM Machine

on:
  push:
    branches: [main]
    paths:
      - "cdm-v3/**"
      - "data/pages.json"
      - "drafts/**"
      - "scripts/validate-pages.mjs"
      - "server.js"
      - ".github/workflows/cdm-machine.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "cdm-v3/**"
      - "data/pages.json"
      - "drafts/**"
      - "scripts/validate-pages.mjs"
      - "server.js"
      - ".github/workflows/cdm-machine.yml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  python-machine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdm-v3
    env:
      PYTHONPATH: ${{ github.workspace }}/cdm-v3
      CDM_DB_PATH: /tmp/cdm-ci.sqlite3
      CDM_SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cdm-v3/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile application
        run: python -m compileall -q app
      - name: Run tests
        run: python -m pytest -q
      - name: Verify service routes
        run: |
          uvicorn app.main_machine:app --host 127.0.0.1 --port 8010 > /tmp/cdm-machine.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8010/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8010/api/machine/health | grep '"status":"ok"'
          curl -fsSL http://127.0.0.1:8010/ | grep 'Machine de contrôle'
          curl -fsS http://127.0.0.1:8010/machine-api.js | grep 'api/machine'

  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Validate pages and drafts
        run: npm test
      - name: Verify protected BAT route
        env:
          PORT: "3010"
          ADMIN_PASSWORD: "ci-only"
        run: |
          node server.js > /tmp/cdm-bridge.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3010/health && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3010/atelier?password=ci-only" | grep 'pouvoir-et-miroirs-recette.html'
          curl -fsS "http://127.0.0.1:3010/atelier/file/revue-des-satires%2Fpouvoir-et-miroirs-recette.html?password=ci-only" | grep 'La Revue des Satires — Pouvoir et miroirs — Recette humaine'
          curl -fsS http://127.0.0.1:3010/preview/cdm-validation-v040 | grep 'Machine de contrôle'
          curl -fsS http://127.0.0.1:3010/preview/cdm-validation-v040 | grep 'Contrôle global'

  live-cdm-bat:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CDM BAT deployment on Bridge
        run: |
          url="https://bridge.lesmotsimages.com/health"
          ok=0
          for attempt in $(seq 1 36); do
            code=$(curl -sSL --max-time 30 -o /tmp/health.json -w '%{http_code}' "$url" || true)
            echo "Attempt $attempt: HTTP $code"
            cat /tmp/health.json || true
            if [ "$code" = "200" ] && python - <<'PY'
import json
from pathlib import Path
try:
    data = json.loads(Path('/tmp/health.json').read_text())
except Exception:
    raise SystemExit(1)
assert data.get('ok') is True
assert int(data.get('drafts', 0)) >= 36
PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
          curl -fsSL --max-time 30 https://bridge.lesmotsimages.com/atelier -o /tmp/atelier.html
          grep 'Bridge LMI' /tmp/atelier.html
          grep 'Mot de passe administrateur' /tmp/atelier.html
