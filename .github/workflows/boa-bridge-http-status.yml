name: Boa Bridge HTTP status diagnostic

on:
  push:
    branches:
      - agent/boa-totem-soya-render-verify-20260816
    paths:
      - .github/workflows/boa-bridge-http-status.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostiquer le routage du Bridge
        run: |
          set -x
          echo '--- DNS custom domain ---'
          dig +short CNAME bridge.lesmotsimages.com || true
          dig +short bridge.lesmotsimages.com || true
          echo '--- custom headers ---'
          curl -sSIL --max-time 30 https://bridge.lesmotsimages.com/health || true
          echo '--- known Render headers ---'
          curl -sSIL --max-time 30 https://cillo-zoho-bridge.onrender.com/health || true
