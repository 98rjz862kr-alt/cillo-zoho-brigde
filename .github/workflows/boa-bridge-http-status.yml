name: Boa Bridge HTTP status diagnostic

on:
  push:
    branches:
      - agent/boa-totem-soya-render-verify-20260816
    paths:
      - .github/workflows/boa-bridge-http-status.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le Bridge après synchronisation de branche historique
        shell: bash
        run: |
          set -euo pipefail
          echo '--- custom health ---'
          curl --fail --silent --show-error --max-time 30 https://bridge.lesmotsimages.com/health
          echo
          echo '--- recipe status ---'
          curl --silent --show-error --max-time 30 -o /tmp/recipe.html -w '%{http_code}\n' 'https://bridge.lesmotsimages.com/atelier/file/boa-totem-soya%2F25-recette-humaine-finale.html'
          echo '--- recipe fingerprint ---'
          grep -o 'RECETTE HUMAINE FINALE' /tmp/recipe.html | head -n 1 || true
# probe 2026-08-16T15:10+02:00
