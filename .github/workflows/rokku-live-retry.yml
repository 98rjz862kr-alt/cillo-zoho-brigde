name: ROKKU Live Retry

on:
  pull_request:
    paths:
      - ".github/workflows/rokku-live-retry.yml"

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Bridge domain
        run: |
          set -euxo pipefail
          getent hosts bridge.lesmotsimages.com
      - name: Check Bridge health
        run: |
          set -euxo pipefail
          curl -fsS --max-time 30 https://bridge.lesmotsimages.com/health
      - name: Check ROKKU BAT route
        run: |
          set -euxo pipefail
          code=$(curl -sS -L --max-time 30 -o /tmp/rokku.html -w '%{http_code}' 'https://bridge.lesmotsimages.com/atelier/file/rokku-site%2F01-bat-boutique.html')
          echo "HTTP $code"
          test "$code" = "200" -o "$code" = "401"
