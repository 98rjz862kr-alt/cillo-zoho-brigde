name: Hub LMI - Browser QA

on:
  pull_request:
    paths:
      - "drafts/hub-lmi-editions/**"
      - "drafts.js"
      - "hub-*.js"
      - "scripts/validate-hub*.mjs"
      - "tests/hub-browser.spec.mjs"
      - ".github/workflows/hub-browser-qa.yml"
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Static and semantic QA
        run: npm test
      - name: Start protected Bridge locally
        run: |
          ADMIN_PASSWORD=hub-qa-local PORT=3000 npm start > /tmp/hub-bridge.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/health >/tmp/health.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/hub-bridge.log
          exit 1
      - name: Desktop and mobile browser QA
        run: npx playwright test tests/hub-browser.spec.mjs --reporter=line
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-browser-qa-evidence
          path: artifacts/hub-browser
          if-no-files-found: warn
