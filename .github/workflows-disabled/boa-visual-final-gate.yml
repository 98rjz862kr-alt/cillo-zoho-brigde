name: Boa Totem - visual final gate

on:
  push:
    branches: [main]
    paths:
      - "drafts/boa-totem-soya/visual-qa-final.json"
      - "scripts/validate-boa-visual-final.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Etat du gate graphique
        shell: bash
        run: |
          if [ ! -f drafts/boa-totem-soya/visual-qa-final.json ]; then
            echo "BLOCKED: aucun manifeste de QA visuelle finale. La recette humaine reste suspendue."
            exit 0
          fi
          node scripts/validate-boa-visual-final.mjs
