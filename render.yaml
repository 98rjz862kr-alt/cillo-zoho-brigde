services:
  - type: web
    name: cillo-zoho-bridge
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5

  - type: web
    name: cdm-collectes-validation
    runtime: python
    plan: free
    region: frankfurt
    rootDir: cdm-v3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_machine:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CDM_DB_PATH
        value: /tmp/cdm.sqlite3
      - key: CDM_SEED_DEMO
        value: "true"
