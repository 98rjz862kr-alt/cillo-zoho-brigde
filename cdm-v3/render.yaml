services:
  - type: web
    name: cdm-collectes-v3
    runtime: python
    plan: free
    rootDir: cdm-v3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_machine:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CDM_DB_PATH
        value: /tmp/cdm.sqlite3
      - key: CDM_SEED_DEMO
        value: "true"
